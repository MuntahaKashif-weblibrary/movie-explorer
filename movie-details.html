<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Details | Movie Explorer</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="movie-page.css">
</head>

<body>

    
    <main id="movieDetailsPage">
   <section class="movie-details__trailer">
  <div class="trailer-wrap">
   <p id="trailerLoading" class="trailer-loading">
  Loading trailer...
</p>
    <iframe
      id="detailsTrailer"
      src=""
      title="Movie Trailer"
      allowfullscreen
    ></iframe>

    <p id="trailerFallback" class="trailer-fallback hidden">
      Trailer not available.
    </p>

  </div>
</section>

  <section class="movie-details">

    <div class="movie-details__poster-wrap">
      <img
        id="detailsPoster"
        class="movie-details__poster"
        src=""
        alt=""
      >
    </div>

    <div class="movie-details__content">

      <p id="detailsGenre" class="movie-details__genre"></p>

      <h1 id="detailsTitle" class="movie-details__title"></h1>

      <div class="movie-details__meta">
        <span id="detailsYear"></span>
        <span id="detailsRating"></span>
      </div>

      <p id="detailsDescription" class="movie-details__description"></p>

      <button
        id="detailsFavoriteBtn"
        class="movie-details__favorite"
        type="button"
      >
        Add to Favorites
      </button>

    </div>

  </section>
    <section class="movie-cast">

  <h2 class="movie-cast__title">Cast</h2>

  <div class="movie-cast__slider">

  <button id="castPrev" class="cast-arrow" type="button">‹</button>

  <div id="castGrid" class="movie-cast__grid"></div>

  <button id="castNext" class="cast-arrow" type="button">›</button>

</div>

</section>

<section class="related-movies">

  <h2 class="related-movies__title">More Like This</h2>

  <div id="relatedGrid" class="related-movies__grid"></div>

</section>

</main>
 <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="Api.js"></script>
<script src="render.js"></script>
<script src="movie-details.js"></script>
</body>
</html>
